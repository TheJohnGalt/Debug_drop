version: "3.8"

services:
  client:
    depends_on:
     - telemetry
    image: revchenkov/bpla_fire_smoke_human_rk3588:latest
    build:
      context: ../
      dockerfile: containerization/Dockerfile_rk3588
      args:
        BASE_IMAGE: python:3.9-slim
        INSTALL_TORCH: "0"
    platform: linux/arm64
    network_mode: host
    ipc: host
    privileged: true
    environment:
      FIRE_UAV_ROLE: module
      FIRE_UAV_PROFILE: rk3588
      FIRE_UAV_SETTINGS: /app/fire_uav/config/settings_rk3588.json
      LD_LIBRARY_PATH: /usr/lib:/usr/lib/aarch64-linux-gnu
    volumes:
      - /dev:/dev
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
    restart: unless-stopped

  telemetry:
    image: revchenkov/telemetry:latest
    build:
      context: ../
      dockerfile: containerization/telemetry/Dockerfile
    network_mode: host
    environment:
      CONFIG_PATH: /app/config.json
    devices:
      - /dev/ttyUSB1:/dev/ttyUSB1
    group_add:
      - dialout
    restart: unless-stopped